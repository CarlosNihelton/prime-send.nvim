name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest of each series:
        neovim: ["v0.10.4", "v0.11.7", "v0.12.5"]
    name: check (neovim ${{ matrix.neovim }})
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks unzip
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1

          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.0/stylua-linux-x86_64.zip \
            -o "$RUNNER_TEMP/stylua.zip"
          mkdir -p "$RUNNER_TEMP/stylua"
          unzip -q -o "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          sudo install -m 0755 "$RUNNER_TEMP/stylua/stylua" /usr/local/bin/stylua
      - name: Run checks
        run: make check
